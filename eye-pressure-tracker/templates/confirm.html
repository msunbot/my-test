{% extends "base.html" %}
{% block content %}
<h1>Check the Reading</h1>
<div class="subtitle">Fix anything that looks wrong, then save</div>
<div class="card">
  <form action="{{ url_for('save') }}" method="post">
    <label for="date">Date</label>
    <input type="date" id="date" name="date" value="{{ reading.date }}" required>

    <label for="time">Time</label>
    <input type="time" id="time" name="time" value="{{ reading.time }}" required>

    <label for="pressure_left">Left Eye Pressure</label>
    <input type="number" step="0.1" id="pressure_left" name="pressure_left" value="{{ reading.pressure_left }}" placeholder="e.g. 16">

    <label for="pressure_right">Right Eye Pressure</label>
    <input type="number" step="0.1" id="pressure_right" name="pressure_right" value="{{ reading.pressure_right }}" placeholder="e.g. 17">

    <button type="submit">Save Reading</button>
  </form>
</div>
<a class="btn secondary" href="{{ url_for('index') }}">Take a Different Photo</a>
{% endblock %}
